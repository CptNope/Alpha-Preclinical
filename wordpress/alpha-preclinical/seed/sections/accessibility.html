<!-- wp:alpha/accessibility-content {"toc_aria_label":"On this page","h2":"On this page","li_items":[{"li":"\u003ca href=\u0022#commitment\u0022\u003eOur commitment\u003c/a\u003e"},{"li":"\u003ca href=\u0022#measures\u0022\u003eWhat we have done\u003c/a\u003e"},{"li":"\u003ca href=\u0022#testing\u0022\u003eHow we tested\u003c/a\u003e"},{"li":"\u003ca href=\u0022#limitations\u0022\u003eKnown limitations\u003c/a\u003e"},{"li":"\u003ca href=\u0022#feedback\u0022\u003eFeedback and alternative formats\u003c/a\u003e"},{"li":"\u003ca href=\u0022#technical\u0022\u003eTechnical details\u003c/a\u003e"}],"h2_2":"Our commitment","p":"We aim for this website to conform to the Web Content Accessibility Guidelines (WCAG) 2.1 at Level AA, published by the World Wide Web Consortium (W3C). These guidelines explain how to make web content usable by people with a wide range of disabilities, including visual, auditory, motor and cognitive disabilities.","h2_3":"What we have done","p_2":"Accessibility was part of the design of this website from the start. Specifically, the site:","li_items_2":[{"li":"Uses text and background colors that meet WCAG AA contrast ratios"},{"li":"Can be used with a keyboard alone, with a visible focus indicator and a \u0022Skip to content\u0022 link on every page"},{"li":"Uses semantic headings, landmarks and labeled form fields so screen readers can navigate it"},{"li":"Describes meaningful images with alternative text"},{"li":"Explains form errors in text and moves focus to the field that needs attention"},{"li":"Announces filter results to screen readers"},{"li":"Reflows to a single column down to 320 pixels wide without horizontal scrolling"},{"li":"Lets you pause the wave animation at the top of every page, and starts it paused if your device is set to reduce motion"}],"h2_4":"How we tested","p_items":[{"p":"The site was evaluated against WCAG 2.1 AA using automated testing with axe-core on every page, plus manual checks of keyboard navigation, focus visibility, color contrast, text spacing, reflow at 320 pixels, touch target sizes and heading structure."},{"p":"We plan to repeat this review whenever we make significant changes to the site, and at least once a year."}],"h2_5":"Known limitations","li_items_3":[{"li":"\u003cb\u003ePublication PDFs.\u003c/b\u003e Some research papers we link to are hosted by journals or provided as PDFs we did not create, and may not be fully accessible. Email us and we will help you get the information in another format."},{"li":"\u003cb\u003eMap image.\u003c/b\u003e The map on our contact page is an image. Our full street address is always provided as text beside it."}],"h2_6":"Feedback and alternative formats","p_3":"If you have trouble using any part of this website, or need information in a different format, please contact us:","li_items_4":[{"li":"Email: \u003ca href=\u0022mailto:info@alphapreclinical.com\u0022\u003einfo@alphapreclinical.com\u003c/a\u003e"},{"li":"Mail: Alpha Preclinical LLC, 722 Plantation Street, Worcester, MA 01605"}],"p_4":"Please tell us the page address and the problem you found. We aim to respond within [number] business days.","h2_7":"Technical details","p_5":"This website relies on HTML, CSS, WAI-ARIA and JavaScript to work with your browser and any assistive technology you use. Core content remains readable if JavaScript is turned off."} /-->
