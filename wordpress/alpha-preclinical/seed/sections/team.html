<!-- wp:alpha/team-leadership {"grp_h":"Leadership","img_img":"assets/img/team/barak-yahalom.jpg","img_alt":"Barak Yahalom","alt_img":"assets/img/team/barak-yahalom-alt.jpg","h3":"Barak Yahalom, DVM","role":"Chief Executive Officer and Chief Scientific Officer","li_items":[{"li_url":"https://www.linkedin.com/in/barak-yahalom-dvm-8631089/","li_aria_label":"Barak Yahalom on LinkedIn (opens in new tab)","li":"LinkedIn"},{"li_url":"https://pubmed.ncbi.nlm.nih.gov/?term=22368175%5Bpmid%5D%20OR%2023114041%5Bpmid%5D%20OR%2015235770%5Bpmid%5D%20OR%2030879951%5Bpmid%5D%20OR%2027356951%5Bpmid%5D%20OR%2033274557%5Bpmid%5D%20OR%2022363247%5Bpmid%5D%20OR%2021555934%5Bpmid%5D\u0026sort=date","li_aria_label":"Barak Yahalom's 8 papers on PubMed (opens in new tab)","li":"PubMed"}],"p_items":[{"p":"Barak Yahalom, DVM, is Chief Executive Officer and Chief Scientific Officer of Alpha Preclinical and a founding member of its scientific team. He sets the scientific direction for client programs at Alpha's Worcester, Massachusetts facility and works directly with sponsors on study design, from PK/PD and dose selection through efficacy in validated disease models."},{"p":"Barak has more than 20 years of scientific and veterinary experience in biotechnology and preclinical contract research. Before Alpha, he was director of in vivo pharmacology at several biotech companies and held positions of increasing responsibility at Boston Children's Hospital and Biomere. He earned his DVM at the Koret School of Veterinary Medicine and a BS in animal science, both at the Hebrew University of Jerusalem, and serves on the Sideromics Scientific Advisory Board."},{"p":"His eight peer-reviewed papers, published from 2004 to 2021, cover the kinds of work Alpha runs today: rat models of type 1 diabetes (\u003ci\u003eDiabetes\u003c/i\u003e; \u003ci\u003eComparative Medicine\u003c/i\u003e), antidiabetic peptides in experimental diabetes (\u003ci\u003eDiabetologia\u003c/i\u003e), mRNA liver depot therapy for hemophilia B and Fabry disease (\u003ci\u003eGene Therapy\u003c/i\u003e; \u003ci\u003eMolecular Therapy\u003c/i\u003e), and pediatric anesthesia and analgesia models, including his first-authored model of spinal anesthesia in infant rats (\u003ci\u003eAnesthesiology\u003c/i\u003e, 2011)."},{"p":"He is most interested in pairing a deep understanding of disease models with well-executed translational studies, so that a client's new science can become a therapy or device."}],"h4":"Selected publications","li_items_2":[{"li":"\u003ca aria-label=\u0022Spinal Anesthesia in Infant Rats: Development of a Model and Assessment of Neurologic Outcomes (PubMed, opens in new tab)\u0022 href=\u0022https://pubmed.ncbi.nlm.nih.gov/21555934/\u0022 rel=\u0022noopener\u0022 target=\u0022_blank\u0022\u003eSpinal Anesthesia in Infant Rats: Development of a Model and Assessment of Neurologic Outcomes\u003c/a\u003e \u003cspan\u003e\u003ci\u003eAnesthesiology\u003c/i\u003e, 2011 (first author)\u003c/span\u003e"},{"li":"\u003ca aria-label=\u0022Improved Efficacy in a Fabry Disease Model Using a Systemic mRNA Liver Depot System as Compared to Enzyme Replacement Therapy (PubMed, opens in new tab)\u0022 href=\u0022https://pubmed.ncbi.nlm.nih.gov/30879951/\u0022 rel=\u0022noopener\u0022 target=\u0022_blank\u0022\u003eImproved Efficacy in a Fabry Disease Model Using a Systemic mRNA Liver Depot System as Compared to Enzyme Replacement Therapy\u003c/a\u003e \u003cspan\u003e\u003ci\u003eMolecular Therapy\u003c/i\u003e, 2019\u003c/span\u003e"},{"li":"\u003ca aria-label=\u0022Prevention of Type 1 Diabetes in the Rat With an Allele-Specific Anti–T-Cell Receptor Antibody (PubMed, opens in new tab)\u0022 href=\u0022https://pubmed.ncbi.nlm.nih.gov/22368175/\u0022 rel=\u0022noopener\u0022 target=\u0022_blank\u0022\u003ePrevention of Type 1 Diabetes in the Rat With an Allele-Specific Anti–T-Cell Receptor Antibody\u003c/a\u003e \u003cspan\u003e\u003ci\u003eDiabetes\u003c/i\u003e, 2012\u003c/span\u003e"}],"h4_2":"Leads","li_items_3":[{"li":"\u003ca href=\u0022/expertise/#pk-pd\u0022\u003ePK/PD\u003c/a\u003e"},{"li":"\u003ca href=\u0022/expertise/#gene-therapy\u0022\u003eGene therapy\u003c/a\u003e"},{"li":"\u003ca href=\u0022/tumor-models/\u0022\u003eTumor models\u003c/a\u003e"},{"li":"\u003ca href=\u0022/expertise/#fibrosis\u0022\u003eInflammation and fibrosis\u003c/a\u003e"},{"li":"\u003ca href=\u0022/services/#ivis\u0022\u003eIVIS imaging\u003c/a\u003e"},{"li":"\u003ca href=\u0022/services/#surgery\u0022\u003eSurgical services\u003c/a\u003e"}],"h4_3":"Education","li_items_4":[{"li":"DVM, Koret School of Veterinary Medicine, Hebrew University of Jerusalem"},{"li":"BS, Animal Science, Hebrew University of Jerusalem"}],"h4_4":"Before Alpha","li_items_5":[{"li":"Director of in vivo pharmacology, biotech"},{"li":"Boston Children's Hospital"},{"li":"Biomere"}],"h4_5":"Affiliations","li":"Sideromics Scientific Advisory Board","a_url":"/publications/","a":"8 publications, 2004–2021","img_img_2":"assets/img/team/joan-flanagan.jpg","img_alt_2":"Joan Flanagan","alt_img_2":"assets/img/team/joan-flanagan-alt.jpg","h3_2":"Joan Flanagan, PhD","role_2":"President and Chief Operating Officer","li_items_6":[{"li_url":"https://www.linkedin.com/in/joan-flanagan-phd-62368911/","li_aria_label":"Joan Flanagan on LinkedIn (opens in new tab)","li":"LinkedIn"},{"li_url":"https://pubmed.ncbi.nlm.nih.gov/?term=16123363%5Bpmid%5D%20OR%2015229376%5Bpmid%5D%20OR%2012524530%5Bpmid%5D%20OR%2010198436%5Bpmid%5D\u0026sort=date","li_aria_label":"Joan Flanagan's 4 papers on PubMed (opens in new tab)","li":"PubMed"}],"p_items_2":[{"p":"Joan Flanagan, PhD, is President and Chief Operating Officer of Alpha Preclinical and a founding member of its scientific team. She runs Alpha's operations and leads its metabolic and autoimmune disease programs, guiding the development, execution and strategy of client studies."},{"p":"Joan has more than 20 years of experience in in vivo preclinical contract research, with positions of increasing responsibility at Biomedical Research Models and Charles River Laboratories. She earned her PhD in molecular biology and biochemistry at UMass Medical School in Worcester and her BS in biochemistry at UMass Amherst."},{"p":"Her publications trace that path from molecular biology to disease models. Her first-authored paper in \u003ci\u003eNucleic Acids Research\u003c/i\u003e (1999) and a 2003 paper in \u003ci\u003eNature Structural Biology\u003c/i\u003e examined the yeast SWI/SNF chromatin-remodeling complex. She then co-authored work characterizing rodent models of diabetes and metabolic disease: the BBZDR/Wor rat for the complications of type 2 diabetes (\u003ci\u003eILAR Journal\u003c/i\u003e, 2004), the LEW.1WR1 rat model of autoimmune diabetes (\u003ci\u003eDiabetes\u003c/i\u003e, 2005) and the C57BL/6NCrl-lb mouse model of metabolic syndrome (\u003ci\u003eFASEB Journal\u003c/i\u003e abstract, 2007)."},{"p":"She contributes to the region's research community through the Massachusetts Society for Medical Research, the New England Branch of AALAS and the Worcester Technical High School Scientific Advisory Board."}],"h4_6":"Selected publications","li_items_7":[{"li":"\u003ca aria-label=\u0022A role for the yeast SWI/SNF complex in DNA replication (PubMed, opens in new tab)\u0022 href=\u0022https://pubmed.ncbi.nlm.nih.gov/10198436/\u0022 rel=\u0022noopener\u0022 target=\u0022_blank\u0022\u003eA role for the yeast SWI/SNF complex in DNA replication\u003c/a\u003e \u003cspan\u003e\u003ci\u003eNucleic Acids Research\u003c/i\u003e, 1999 (first author)\u003c/span\u003e"},{"li":"\u003ca aria-label=\u0022LEW.1WR1 Rats Develop Autoimmune Diabetes Spontaneously and in Response to Environmental Perturbation (PubMed, opens in new tab)\u0022 href=\u0022https://pubmed.ncbi.nlm.nih.gov/16123363/\u0022 rel=\u0022noopener\u0022 target=\u0022_blank\u0022\u003eLEW.1WR1 Rats Develop Autoimmune Diabetes Spontaneously and in Response to Environmental Perturbation\u003c/a\u003e \u003cspan\u003e\u003ci\u003eDiabetes\u003c/i\u003e, 2005\u003c/span\u003e"},{"li":"\u003ca aria-label=\u0022The BBZDR/Wor Rat Model for Investigating the Complications of Type 2 Diabetes Mellitus (PubMed, opens in new tab)\u0022 href=\u0022https://pubmed.ncbi.nlm.nih.gov/15229376/\u0022 rel=\u0022noopener\u0022 target=\u0022_blank\u0022\u003eThe BBZDR/Wor Rat Model for Investigating the Complications of Type 2 Diabetes Mellitus\u003c/a\u003e \u003cspan\u003e\u003ci\u003eILAR Journal\u003c/i\u003e, 2004\u003c/span\u003e"}],"h4_7":"Leads","li_items_8":[{"li":"\u003ca href=\u0022/expertise/#metabolic\u0022\u003eMetabolic disease\u003c/a\u003e"},{"li":"\u003ca href=\u0022/expertise/#autoimmune\u0022\u003eAutoimmune disease\u003c/a\u003e"},{"li":"\u003ca href=\u0022/about/\u0022\u003eOperations\u003c/a\u003e"}],"div_items":[{"h4":"Education","li_items_9":[{"li":"PhD, Molecular Biology and Biochemistry, UMass Medical School, Worcester"},{"li":"BS, Biochemistry, UMass Amherst"}]},{"h4":"Before Alpha","li_items_9":[{"li":"Biomedical Research Models"},{"li":"Charles River Laboratories"}]}],"h4_8":"Affiliations","li_items_10":[{"li":"Massachusetts Society for Medical Research, Training and Program Development"},{"li":"New England Branch, AALAS (NEBAALAS)"},{"li":"Worcester Technical High School Scientific Advisory Board"},{"li":"[Confirm: Becker College Industry Advisory Board]"}],"a_url_2":"/publications/","a_2":"5 publications, 1999–2007","metadata":{"bindings":{"h3":{"source":"alpha/person","args":{"slug":"barak-yahalom","key":"name"}},"role":{"source":"alpha/person","args":{"slug":"barak-yahalom","key":"job_title"}},"h3_2":{"source":"alpha/person","args":{"slug":"joan-flanagan","key":"name"}},"role_2":{"source":"alpha/person","args":{"slug":"joan-flanagan","key":"job_title"}}}}} /-->

<!-- wp:alpha/team-research {"grp_h":"Founding research team","img_img":"assets/img/team/ashley-kolofsky.jpg","img_alt":"Ashley Kolofsky","alt_img":"assets/img/team/ashley-kolofsky-alt.jpg","h3":"Ashley Kolofsky","role":"Study Team Supervisor and Vivarium Operations","li_url":"https://www.linkedin.com/in/ashley-kolofsky-435807196/","li_aria_label":"Ashley Kolofsky on LinkedIn (opens in new tab)","li":"LinkedIn","p_items":[{"p":"Ashley Kolofsky supervises Alpha Preclinical's study team and oversees day-to-day vivarium operations at its Worcester facility. A founding member of the research team since 2020, she coordinates study schedules so that dosing, sampling and observations happen when the protocol says they should, and she leads Alpha's rodent colony management and custom breeding programs."},{"p":"She holds a BS in zoology from the University of Maine, Orono, and completed field studies with the School for Field Studies in Karatu, Tanzania. She brings that grounding in animal biology and welfare to every study, and values applying it to research with a direct human impact."}],"h4":"Leads","li_items":[{"li":"\u003ca href=\u0022/services/#colony\u0022\u003eColony management\u003c/a\u003e"},{"li":"\u003ca href=\u0022/services/#colony\u0022\u003eStudy scheduling and vivarium operations\u003c/a\u003e"}],"h4_2":"Education","li_items_2":[{"li":"BS, Zoology, University of Maine, Orono"},{"li":"Field studies, School for Field Studies, Karatu, Tanzania"}],"img_img_2":"assets/img/team/cindy-hopper.jpg","img_alt_2":"Cindy Hopper","alt_img_2":"assets/img/team/cindy-hopper-alt.jpg","h3_2":"Cindy Hopper","role_2":"Founding Scientist, In Vitro Laboratory Services","p_items_2":[{"p":"Cindy Hopper is a founding scientist at Alpha Preclinical and leads its in vitro laboratory services: multicolor flow cytometry and immunophenotyping, ELISA and cytokine assays, CBC and serum chemistry, primary cell isolation, and histology and immunohistochemistry on the samples clients' in vivo studies generate. Because the lab sits beside the vivarium, samples are processed fresh, on site."},{"p":"She also leads project development, working with client teams to solve the technical problems that stand between a program and its study goals. Cindy earned an associate degree at Quinsigamond Community College and continued her studies at Worcester Polytechnic Institute."},{"p":"She is motivated by biotech's capacity to change what is possible for patients, and by preventive approaches to medicine."}],"h4_3":"Leads","li_items_3":[{"li":"\u003ca href=\u0022/services/#in-vitro\u0022\u003eIn vitro laboratory services\u003c/a\u003e"},{"li":"\u003ca href=\u0022/blog/flow-cytometry-immunophenotyping-in-vivo-studies/\u0022\u003eFlow cytometry and immunophenotyping\u003c/a\u003e"}],"h4_4":"Education","li_items_4":[{"li":"AS, Quinsigamond Community College"},{"li":"Continuing studies, Worcester Polytechnic Institute"}],"img_img_3":"assets/img/team/gil-chacon.jpg","img_alt_3":"Gil Chacon","alt_img_3":"assets/img/team/gil-chacon-alt.jpg","h3_3":"Gil Chacon","role_3":"In Vivo Studies, Surgical Support and Training","p_items_3":[{"p":"Gil Chacon executes in vivo studies at Alpha Preclinical, providing technical and surgical support, training staff and keeping the research facility running. He has been part of the founding research team since 2020."},{"p":"Gil has nearly 20 years of experience in preclinical contract research. Before Alpha, he was training and development coordinator at a preclinical CRO, where he made sure staff were fully trained before study assignment, supervised day-to-day study performance, managed assigned programs and maintained the research facility. Over those years he helped build that company's facility operations and study execution, and became proficient in nearly every aspect of in vivo contract research."},{"p":"He is especially motivated by vaccine development research."}],"h4_5":"Supports","li_items_5":[{"li":"\u003ca href=\u0022/services/#surgery\u0022\u003eSurgical services\u003c/a\u003e"},{"li":"\u003ca href=\u0022/expertise/\u0022\u003eIn vivo studies\u003c/a\u003e"},{"li":"\u003ca href=\u0022/careers/\u0022\u003eStaff training\u003c/a\u003e"}],"h4_6":"Experience","li_items_6":[{"li":"Nearly 20 years in preclinical research"},{"li":"Former training and development coordinator at a preclinical CRO"}],"h4_7":"Education","li_2":"Second Language Certificate, Worcester State College","metadata":{"bindings":{"h3":{"source":"alpha/person","args":{"slug":"ashley-kolofsky","key":"name"}},"role":{"source":"alpha/person","args":{"slug":"ashley-kolofsky","key":"job_title"}},"h3_2":{"source":"alpha/person","args":{"slug":"cindy-hopper","key":"name"}},"role_2":{"source":"alpha/person","args":{"slug":"cindy-hopper","key":"job_title"}},"h3_3":{"source":"alpha/person","args":{"slug":"gil-chacon","key":"name"}},"role_3":{"source":"alpha/person","args":{"slug":"gil-chacon","key":"job_title"}}}}} /-->
