<section class="sec exp-sec" id="expertise" aria-labelledby="exp-h">
  <div class="wrap exp-grid">
    <div class="exp-aside">
      <h2 id="exp-h">{{&h2}}</h2>
      <p>{{&p}}</p>
      <a class="btn btn-primary" href="{{@btn_primary_url}}">{{&btn_primary}}</a>
    </div>
    <ul class="models">
      {{#li_items}}<li><a class="model" href="{{@model_url}}"><h3>{{&h3}}</h3><div><p>{{&p}}</p><small class="lead"><img src="{{@img_img}}" alt="">{{&text}}</small></div><span>{{&span}}</span></a></li>
      {{/li_items}}
    </ul>
  </div>
</section>
