<section class="area area-mist" aria-labelledby="in-vitro-h">
  <div class="wrap">
    <article class="svc full" id="in-vitro">
      <div>
        <h2 id="in-vitro-h">{{&h2}}</h2>
        <p class="desc">{{&desc}}</p>
        <div class="lead"><img src="{{@img_img}}" alt=""><div>{{&div}}</div></div>
        <a class="area-cta" href="{{@area_cta_url}}">{{&area_cta}}</a>
      </div>
      <div class="detail">
        <div><h3>{{&h3}}</h3><ul>
          {{#li_items}}<li>{{&li}}</li>
          {{/li_items}}
        </ul></div>
        {{#div_items}}<div><h3>{{&h3}}</h3><ul>
          {{#li_items_2}}<li>{{&li}}</li>
          {{/li_items_2}}
        </ul></div>
        {{/div_items}}
        <p class="related">{{&related}}</p>
      </div>
    </article>
  </div>
</section>
