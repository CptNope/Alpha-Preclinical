<section class="svc-split" id="capabilities" aria-labelledby="cap-h">
  <div class="svc-photo-col">
    <img src="{{@img_img}}" alt="{{img_alt}}" loading="lazy" width="{{img_width}}" height="{{img_height}}">
  </div>
  <div class="svc-body">
    <h2 id="cap-h">{{&h2}}</h2>
    <p class="svc-intro">{{&svc_intro}}</p>
    <ul class="svc-rows">
      {{#li_items}}<li><a class="svc-row" href="{{@svc_row_url}}">{{%svc_ico_icon}}<span>{{&span}}</span></a></li>
      {{/li_items}}
    </ul>
    <p class="more-links">{{&more_links}}</p>
  </div>
</section>
