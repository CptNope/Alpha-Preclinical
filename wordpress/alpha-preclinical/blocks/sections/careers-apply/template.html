<section class="sec" id="apply" aria-labelledby="apply-h">
  <div class="wrap apply-sec">
    <div>
      <h2 class="h2" id="apply-h">{{&h2}}</h2>
      <p class="intro">{{&intro}}</p>
    </div>
    <div>
      
        <form data-demo-form novalidate>
          <div class="fields">
            <div class="field"><label for="a-fn">{{&label}}</label><input id="a-fn" autocomplete="given-name"></div>
            <div class="field"><label for="a-ln">{{&label_2}}</label><input id="a-ln" autocomplete="family-name"></div>
            <div class="field"><label for="a-em">{{&label_3}}</label><input id="a-em" type="email" autocomplete="email" required aria-invalid="false" aria-describedby="a-em-err"><span class="err" hidden id="a-em-err">{{&err}}</span></div>
            <div class="field"><label for="a-ph">{{&label_4}}</label><input id="a-ph" type="tel" autocomplete="tel"></div>
            <div class="field full"><label for="a-role">{{&label_5}}</label>
              <select id="a-role" name="role">
                <option value="Senior Research Technician, In Vivo">Senior Research Technician, In Vivo</option><option value="Scientist, In Vivo Study Director">Scientist, In Vivo Study Director</option><option value="Research Associate, In Vivo">Research Associate, In Vivo</option><option value="Research Associate, In Vitro">Research Associate, In Vitro</option><option value="General application">General application</option>
              </select>
            </div>
            <div class="field full"><label for="a-cv">{{&label_6}}</label><input id="a-cv" type="file" accept=".pdf,.doc,.docx"></div>
            <div class="field full"><label for="a-note">{{&label_7}}</label><textarea id="a-note" placeholder="{{textarea_placeholder}}"></textarea></div>
          </div>
          <div class="actions"><button class="btn btn-primary" type="submit">{{&btn_primary}}</button><p>{{&p}}</p></div>
        </form>
      
      
        <div class="done" role="status" data-done hidden><h3>{{&h3}}</h3><p>{{&p_2}}</p><button type="button" data-reset>{{&button}}</button></div>
      
    </div>
  </div>
</section>
