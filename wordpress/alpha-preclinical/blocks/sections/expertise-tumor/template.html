<section class="area area-deep" aria-labelledby="tumor-h">
  <div class="wrap">
    <article class="svc wide media-right" id="tumor">
      <div>
        <h2 id="tumor-h">{{&h2}}</h2>
        <p class="desc">{{&desc}}</p>
        <div class="lead"><img src="{{@img_img}}" alt=""><div>{{&div}}</div></div>
        <a class="area-cta" href="{{@area_cta_url}}">{{&area_cta}}</a>
      </div>
      <figure class="area-media"><img src="{{@img_img_2}}" alt="" width="{{img_width}}" height="{{img_height}}" loading="lazy"></figure>
      <div class="detail">
        <table class="mtable"><thead><tr>{{#th_items}}<th scope="col">{{&th}}</th>{{/th_items}}</tr></thead><tbody>{{#tr_items}}<tr>{{#td_items}}<td>{{&td}}</td>{{/td_items}}</tr>{{/tr_items}}</tbody></table>
        <p class="more">{{&more}}</p>
        <div class="reads"><h3>{{&h3}}</h3><ul><li>{{&li}}</li></ul></div>
      </div>
    </article>
  </div>
</section>
