<section class="area area-paper" aria-labelledby="gene-therapy-h">
  <div class="wrap">
    <article class="svc flip" id="gene-therapy">
      <div>
        <h2 id="gene-therapy-h">{{&h2}}</h2>
        <p class="desc">{{&desc}}</p>
        <div class="lead"><img src="{{@img_img}}" alt=""><div>{{&div}}</div></div>
        <a class="area-cta" href="{{@area_cta_url}}">{{&area_cta}}</a>
      </div>
      <div class="detail">
        <table class="mtable"><thead><tr>{{#th_items}}<th scope="col">{{&th}}</th>{{/th_items}}</tr></thead><tbody>{{#tr_items}}<tr>{{#td_items}}<td>{{&td}}</td>{{/td_items}}</tr>{{/tr_items}}</tbody></table>
        <div class="pubs"><h3>{{&h3}}</h3><ul>{{#li_items}}<li>{{&li}}</li>{{/li_items}}</ul></div>
        <div class="reads"><h3>{{&h3_2}}</h3><ul><li>{{&li}}</li></ul></div>
      </div>
    </article>
  </div>
</section>
