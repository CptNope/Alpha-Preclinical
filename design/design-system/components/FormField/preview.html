<div class="ap-root" style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px 24px">
<div class="ap-field"><label for="n">Name</label><input class="ap-input" id="n" value="Dana Reyes"></div>
<div class="ap-field"><label for="s">Study type</label><select class="ap-input" id="s"><option>Tumor models</option><option>PK/PD</option></select></div>
<div class="ap-field"><label for="e">Work email</label><input class="ap-input" id="e" value="dana@" aria-invalid="true" aria-describedby="ee"><span class="ap-err" id="ee">Enter a full email address, like name@company.com.</span></div>
<div class="ap-field"><label for="c">Compound <small>(optional)</small></label><input class="ap-input" id="c" placeholder="Small molecule, mRNA-LNP, antibody..."></div>
<div class="ap-field" style="grid-column:1/-1"><label for="m">About your study</label><textarea class="ap-input" id="m" style="min-height:72px">Model, endpoints, timeline</textarea></div></div>
