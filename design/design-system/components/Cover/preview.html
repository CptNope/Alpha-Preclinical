<!-- @dsCard height=300 -->
<style>
  html,body{margin:0;background:var(--paper)}
  .cover{position:relative;width:960px;height:300px;background:var(--paper);overflow:hidden}
  .cover svg{position:absolute;left:0;top:0}
  .abyss{fill:var(--abyss)} .tide{fill:var(--tide)} .current{fill:var(--current)} .shallows{fill:var(--shallows)} .mist{fill:var(--mist)}
  .contour{fill:none;stroke:var(--shallows);stroke-width:1.5}
  .slab{rx:var(--radius-m)}
  .txt{position:absolute;left:48px;bottom:44px;width:420px}
  .name{font-family:var(--font-display);font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.03em;color:var(--navy);margin:0}
  .tag{font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--ink-muted);margin:16px 0 0}
</style>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: abyss slab 476x340 (radius-m corner) with tide, current, shallows and mist strata cut across its foot
         arrangement: one tall slab bleeding off the top and right, bands stacked bottom-up like the fill of the logo's alpha
         pattern: literal motif (wave), because the README's one signature shape is the strata, layered flat wave bands; one shallows contour line echoes the section-divider use
         scales: band offsets of about space-4 (40px) and space-3 (24px); slab corner radius-m; contour 1.5px as in ContourDivider -->
    <rect class="abyss slab" x="504" y="-20" width="476" height="340"/>
    <path class="tide" d="M504 150 C 600 110, 690 210, 790 170 S 930 110, 960 128 L960 300 L504 300 Z"/>
    <path class="current" d="M504 198 C 610 160, 700 248, 800 214 S 930 166, 960 180 L960 300 L504 300 Z"/>
    <path class="shallows" d="M504 238 C 620 208, 712 284, 812 256 S 932 220, 960 230 L960 300 L504 300 Z"/>
    <path class="mist" d="M504 272 C 630 252, 720 304, 830 288 S 935 268, 960 274 L960 300 L504 300 Z"/>
    <path class="contour" d="M520 96 C 620 64, 700 140, 800 112 S 920 70, 960 82"/>
  </svg>
  <div class="txt">
    <h1 class="name">Alpha<br>Preclinical</h1>
    <p class="tag">Preclinical in vivo research, run by published scientists. Worcester, Massachusetts.</p>
  </div>
</div>
