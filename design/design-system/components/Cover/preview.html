<!-- @dsCard height=300 -->
<style>
  html,body{margin:0;background:var(--paper)}
  .cover{position:relative;width:960px;height:300px;background:var(--paper);overflow:hidden}
  .cover svg{position:absolute;left:0;top:0}
  .abyss{fill:var(--abyss)} .tide{fill:var(--tide)} .current{fill:var(--current)} .shallows{fill:var(--shallows)} .mist{fill:var(--mist)}
  .contour{fill:none;stroke:var(--shallows);stroke-width:1.5}
  .slab{rx:var(--radius-m)}
  .txt{position:absolute;left:48px;bottom:44px;width:420px}
  .name{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.03em;color:var(--navy);margin:0}
  .tag{font-family:"Figtree","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--ink-muted);margin:16px 0 0}
</style>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: abyss slab 456x300 (radius-m corner), tide/current/shallows wave bands cut from it
         arrangement: one tall slab bleeding off top and right, bands stacked bottom-up like the alpha's fill
         pattern: literal motif (wave) — the logo's alpha is filled with layered wave strata, so the bands ARE the pattern; one shallows contour line as the web divider motif
         scales: band offsets 40px (space-4) and 24px (space-3); slab corner radius-m -->
    <rect class="abyss slab" x="504" y="-20" width="476" height="340"/>
    <path class="tide" d="M504 150 C 600 110, 690 210, 790 170 S 930 110, 960 128 L960 300 L504 300 Z"/>
    <path class="current" d="M504 198 C 610 160, 700 248, 800 214 S 930 166, 960 180 L960 300 L504 300 Z"/>
    <path class="shallows" d="M504 238 C 620 208, 712 284, 812 256 S 932 220, 960 230 L960 300 L504 300 Z"/>
    <path class="mist" d="M504 272 C 630 252, 720 304, 830 288 S 935 268, 960 274 L960 300 L504 300 Z"/>
    <path class="contour" d="M520 96 C 620 64, 700 140, 800 112 S 920 70, 960 82"/>
  </svg>
  <div class="txt">
    <h1 class="name">Alpha<br>Preclinical</h1>
    <p class="tag">Tailored in vivo research for your innovation. Worcester, Massachusetts.</p>
  </div>
</div>
