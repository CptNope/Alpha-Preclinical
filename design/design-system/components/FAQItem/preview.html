<div class="ap-root" style="padding:0 20px"><div class="ap-faq">
<div class="ap-q"><h3><button aria-expanded="true" aria-controls="a1">What species do you work with?<span class="ico"><svg viewBox="0 0 12 12" aria-hidden="true" width="14" height="14"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></button></h3><div class="ans" id="a1">Primarily mice and rats, with capacity for most common laboratory species.</div></div>
<div class="ap-q"><h3><button aria-expanded="false" aria-controls="a2">How fast can a study start?<span class="ico"><svg viewBox="0 0 12 12" aria-hidden="true" width="14" height="14"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></button></h3><div class="ans" id="a2" hidden>It depends on the model and animal availability; we confirm a start date with your quote.</div></div></div></div>
<script>document.querySelectorAll('.ap-q button').forEach(b=>b.onclick=()=>{const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!o);document.getElementById(b.getAttribute('aria-controls')).hidden=o})</script>
