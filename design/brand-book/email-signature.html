<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alpha Preclinical email signature</title>
</head>
<body style="margin:0;padding:24px;background:#FFFFFF">
<!--
  Alpha Preclinical email signature
  1. Replace the [bracketed] text with each person's details (one copy per person).
  2. Open this file in a browser, select the signature below (from the logo to the button), copy, and paste it into:
     Gmail: Settings › See all settings › Signature
     Outlook (web/new): Settings › Mail › Compose and reply › Email signature
     Apple Mail: Settings › Signatures (untick "Always match my default message font")
  3. The logo loads from the live website. Until the new site launches, upload logo-color.png
     somewhere public and replace the src below with that URL.
  Uses Arial because email apps don't load web fonts. Colours: navy #1F2858, tide #1E58A0, current #4B98D2, muted #4A5878.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif">
  <tr>
    <td style="padding:0 20px 0 0;vertical-align:top;border-right:2px solid #4B98D2">
      <a href="https://alphapreclinical.com" style="text-decoration:none"><img src="https://alphapreclinical.com/wp-content/themes/alpha-preclinical/assets/img/logo-color.png" alt="Alpha Preclinical" width="96" height="90" style="display:block;width:96px;height:auto;border:0"></a>
    </td>
    <td style="padding:0 0 0 20px;vertical-align:top">
      <p style="margin:0;font-size:16px;line-height:20px;font-weight:bold;color:#1F2858">[Full name, credentials]</p>
      <p style="margin:2px 0 0;font-size:13px;line-height:18px;color:#4A5878">[Job title]</p>
      <p style="margin:10px 0 0;font-size:13px;line-height:19px;color:#1F2858">
        [Direct phone] &middot; <a href="mailto:[name]@alphapreclinical.com" style="color:#1E58A0;text-decoration:none">[name]@alphapreclinical.com</a><br>
        722 Plantation Street, Worcester, MA 01605<br>
        <a href="https://alphapreclinical.com" style="color:#1E58A0;font-weight:bold;text-decoration:none">alphapreclinical.com</a> &middot; <a href="https://www.linkedin.com/company/alpha-preclinical" style="color:#1E58A0;text-decoration:none">LinkedIn</a>
      </p>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;margin-top:12px">
        <tr>
          <td style="border-radius:999px;background:#1E58A0">
            <a href="https://alphapreclinical.com/contact/#form" style="display:inline-block;padding:8px 16px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;line-height:16px;color:#FFFFFF;text-decoration:none">Request a study quote</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
